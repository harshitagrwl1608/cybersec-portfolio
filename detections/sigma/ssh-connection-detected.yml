title: SSH Connection Detected
id: 7f3a1c2e-4b5d-4a89-9e21-3c8f6d1a2b4e
status: experimental
description: >
  Detects inbound TCP connections to destination port 22. This is a
  visibility-oriented baseline detection; SSH activity should be
  investigated against the environment's expected administrative sources.
author: Harshit
date: 2026-08-22
references:
  - TryHackMe - IDS Fundamentals (Cyber Security 101)
logsource:
  category: network
detection:
  selection:
    dst_port: 22
    protocol: tcp
  condition: selection
falsepositives:
  - Legitimate SSH access from known administrative hosts
  - Automation or monitoring systems that use SSH
level: low
tags:
  - attack.lateral_movement
  - attack.t1021.004
